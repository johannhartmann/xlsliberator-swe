name: XLSLiberator sandbox

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/xlsliberator_sandbox.yml"
      - "agent/xlsliberator/**"
      - "config/xlsliberator.env.example"
      - "docker/xlsliberator-sandbox/**"
      - "docker-compose.sandbox.yml"
      - "docs/XLSLIBERATOR_SANDBOX.md"
      - "scripts/build_xlsliberator_sandbox.sh"
      - "scripts/check_sandbox_no_secrets.sh"
      - "tests/xlsliberator/**"
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-smoke:
    name: Docker-only sandbox smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SANDBOX_IMAGE: xlsliberator-open-swe-sandbox:${{ github.sha }}
      OFFICE_IMAGE: xlsliberator-libreoffice:26.2.4.2
      XLSLIBERATOR_SOURCE_COMMIT: e9e096cbde1cc64dbb2f2c5117ce58a00199c1ff
    steps:
      - uses: actions/checkout@v7
        with:
          path: xlsliberator-swe
      - uses: actions/checkout@v7
        with:
          repository: johannhartmann/xlsliberator
          ref: e9e096cbde1cc64dbb2f2c5117ce58a00199c1ff
          path: xlsliberator
      - uses: docker/setup-buildx-action@v4
      - name: Build pinned office image
        working-directory: xlsliberator
        run: |
          docker buildx build \
            --load \
            --tag "${OFFICE_IMAGE}" \
            --file docker/office/libreoffice/Dockerfile \
            .
      - name: Build migration sandbox
        working-directory: xlsliberator-swe
        run: |
          docker buildx build \
            --load \
            --tag "${SANDBOX_IMAGE}" \
            --build-context xlsliberator=../xlsliberator \
            --build-arg "XLSLIBERATOR_OFFICE_IMAGE=${OFFICE_IMAGE}" \
            --build-arg "OPEN_SWE_SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "XLSLIBERATOR_SOURCE_COMMIT=${XLSLIBERATOR_SOURCE_COMMIT}" \
            --build-arg "XLSLIBERATOR_SANDBOX_IMAGE=${SANDBOX_IMAGE}" \
            --file docker/xlsliberator-sandbox/Dockerfile \
            .
      - name: Verify image identity and credential absence
        working-directory: xlsliberator-swe
        run: |
          scripts/check_sandbox_no_secrets.sh "${SANDBOX_IMAGE}"
          docker image inspect "${SANDBOX_IMAGE}" > sandbox-image-inspect.json
          docker run --rm "${SANDBOX_IMAGE}" \
            xlsliberator-sandbox-identity > sandbox-identity.json
          jq -e \
            --arg open_swe "${GITHUB_SHA}" \
            --arg xlsliberator "${XLSLIBERATOR_SOURCE_COMMIT}" \
            '.status == "PASSED"
             and .image.open_swe_commit == $open_swe
             and .image.xlsliberator_commit == $xlsliberator
             and .image.libreoffice_build == "26.2.4.2"' \
            sandbox-identity.json
      - name: Start trusted LibreOffice MCP orchestrator
        working-directory: xlsliberator
        run: |
          mkdir -p artifacts/mcp-workspace artifacts/runtime-tmp
          docker compose up -d --build xlsliberator-mcp
      - name: Wait for MCP
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null \
              --connect-timeout 1 http://127.0.0.1:8000/mcp
            then
              exit 0
            fi
            sleep 2
          done
          docker compose -f xlsliberator/docker-compose.yml logs xlsliberator-mcp
          exit 1
      - name: Run Docker-only sandbox smoke
        run: |
          docker run --rm \
            --network host \
            --cpus 2 \
            --memory 7936m \
            --pids-limit 1024 \
            -e XLSLIBERATOR_LIBREOFFICE_MCP_ENDPOINT=http://127.0.0.1:8000/mcp \
            "${SANDBOX_IMAGE}" \
            xlsliberator-sandbox-smoke
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.SANDBOX_IMAGE }}
          format: spdx-json
          output-file: xlsliberator-sandbox.spdx.json
          upload-artifact: false
      - name: Collect Docker evidence
        if: ${{ !cancelled() }}
        run: |
          docker compose -f xlsliberator/docker-compose.yml logs \
            --no-color xlsliberator-mcp > libreoffice-mcp.log 2>&1 || true
          docker image inspect "${SANDBOX_IMAGE}" \
            > xlsliberator-swe/sandbox-image-inspect.json
      - name: Upload sandbox evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: xlsliberator-sandbox-evidence
          path: |
            libreoffice-mcp.log
            xlsliberator-sandbox.spdx.json
            xlsliberator-swe/sandbox-identity.json
            xlsliberator-swe/sandbox-image-inspect.json
          retention-days: 14
