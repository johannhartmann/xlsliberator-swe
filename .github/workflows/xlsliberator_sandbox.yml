name: XLSLiberator sandbox

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/xlsliberator_sandbox.yml"
      - "agent/xlsliberator/**"
      - "config/xlsliberator.env.example"
      - "docker/xlsliberator-sandbox/**"
      - "docker-compose.sandbox.yml"
      - "docs/XLSLIBERATOR_SANDBOX.md"
      - "scripts/build_xlsliberator_sandbox.sh"
      - "scripts/check_sandbox_no_secrets.sh"
      - "tests/xlsliberator/**"
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-smoke:
    name: Docker-only sandbox smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SANDBOX_IMAGE: xlsliberator-open-swe-sandbox:${{ github.sha }}
      OFFICE_IMAGE: xlsliberator-libreoffice:26.2.4.2
      XLSLIBERATOR_SOURCE_COMMIT: d4412e974eab8dd6812b821b9535541e2d7ebcac
    steps:
      - uses: actions/checkout@v7
        with:
          path: xlsliberator-swe
      - uses: actions/checkout@v7
        with:
          repository: johannhartmann/xlsliberator
          ref: d4412e974eab8dd6812b821b9535541e2d7ebcac
          path: xlsliberator
      - name: Build pinned office image
        working-directory: xlsliberator
        run: |
          docker build \
            --tag "${OFFICE_IMAGE}" \
            --file docker/office/libreoffice/Dockerfile \
            .
      - name: Build migration sandbox
        working-directory: xlsliberator-swe
        run: |
          docker build \
            --tag "${SANDBOX_IMAGE}" \
            --build-context xlsliberator=../xlsliberator \
            --build-arg "XLSLIBERATOR_OFFICE_IMAGE=${OFFICE_IMAGE}" \
            --build-arg "OPEN_SWE_SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "XLSLIBERATOR_SOURCE_COMMIT=${XLSLIBERATOR_SOURCE_COMMIT}" \
            --build-arg "XLSLIBERATOR_SANDBOX_IMAGE=${SANDBOX_IMAGE}" \
            --file docker/xlsliberator-sandbox/Dockerfile \
            .
      - name: Verify image identity and credential absence
        working-directory: xlsliberator-swe
        run: |
          scripts/check_sandbox_no_secrets.sh "${SANDBOX_IMAGE}"
          docker run --rm --entrypoint /bin/sh "${SANDBOX_IMAGE}" \
            -c 'cat /opt/xlsliberator-environment/uv.lock' \
            > sandbox-resolved.uv.lock
          cmp docker/xlsliberator-sandbox/xlsliberator-env/uv.lock \
            sandbox-resolved.uv.lock
          docker image inspect "${SANDBOX_IMAGE}" > sandbox-image-inspect.json
          docker run --rm "${SANDBOX_IMAGE}" \
            xlsliberator-sandbox-identity > sandbox-identity.json
          jq -e \
            --arg open_swe "${GITHUB_SHA}" \
            --arg xlsliberator "${XLSLIBERATOR_SOURCE_COMMIT}" \
            '.status == "PASSED"
             and .image.open_swe_commit == $open_swe
             and .image.xlsliberator_commit == $xlsliberator
             and .image.libreoffice_build == "26.2.4.2"' \
            sandbox-identity.json
      - name: Verify default hostile-workbook boundary
        working-directory: xlsliberator-swe
        run: |
          set -euo pipefail
          sandbox_args=(
            --init
            --network none
            --read-only
            --cap-drop ALL
            --security-opt no-new-privileges
            --pids-limit 64
            --memory 512m
            --cpus 1
            --tmpfs /workspace:rw,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=1777
            --tmpfs /home/sandbox:rw,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
          )
          docker run --rm "${sandbox_args[@]}" "${SANDBOX_IMAGE}" sh -ec '
            test ! -e /var/run/docker.sock
            test -z "${OPENAI_API_KEY:-}${ANTHROPIC_API_KEY:-}${GITHUB_TOKEN:-}"
            test -z "${LANGSMITH_API_KEY:-}${XLSLIBERATOR_LIBREOFFICE_MCP_TOKEN:-}"
            if touch /etc/xlsliberator-escape 2>/dev/null; then exit 1; fi
            open-swe-python -c '"'"'
          import socket
          sock = socket.socket()
          sock.settimeout(0.2)
          raise SystemExit(1 if sock.connect_ex(("1.1.1.1", 53)) == 0 else 0)
          '"'"'
            xlsprobe --help >/dev/null
            xlsliberator-sandbox-identity >/dev/null
          '
          probe_name="xlsliberator-security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm --detach --name "${probe_name}" \
            "${sandbox_args[@]}" "${SANDBOX_IMAGE}" sh -ec 'sleep 300 & wait'
          docker stop --time 1 "${probe_name}"
          test -z "$(docker ps --all --quiet --filter "name=^/${probe_name}$")"
      - name: Run Docker-based code and dependency audits
        working-directory: xlsliberator-swe
        run: |
          docker run --rm \
            --init \
            --network bridge \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 2g \
            --cpus 2 \
            --volume "$PWD:/source:ro" \
            --tmpfs /workspace:rw,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1777 \
            --tmpfs /home/sandbox:rw,nosuid,nodev,size=1g,uid=10001,gid=10001,mode=0700 \
            --env UV_CACHE_DIR=/home/sandbox/.cache/uv \
            "${SANDBOX_IMAGE}" \
            sh -ec '
              cd /source
              uv venv --python /usr/local/bin/python3.12 /workspace/audit-venv
              uv pip install \
                --python /workspace/audit-venv/bin/python \
                bandit==1.8.6 pip-audit==2.9.0
              /workspace/audit-venv/bin/bandit \
                -q -ll -ii -r agent/xlsliberator
              uv export --locked --no-dev --no-emit-project \
                --format requirements-txt --output-file /workspace/requirements.txt
              /workspace/audit-venv/bin/pip-audit \
                --requirement /workspace/requirements.txt \
                --disable-pip \
                --progress-spinner off
            '
      - name: Start trusted LibreOffice MCP orchestrator
        working-directory: xlsliberator
        run: |
          mkdir -p artifacts/mcp-workspace artifacts/runtime-tmp
          docker compose up -d --build xlsliberator-mcp
      - name: Wait for MCP
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null \
              --connect-timeout 1 http://127.0.0.1:8000/mcp
            then
              exit 0
            fi
            sleep 2
          done
          docker compose -f xlsliberator/docker-compose.yml logs xlsliberator-mcp
          exit 1
      - name: Run Docker-only sandbox smoke
        run: |
          # Explicit trusted CI health capability: this is not the migration-task
          # sandbox default and passes no MCP credential into workbook execution.
          docker run --rm \
            --network host \
            --cpus 2 \
            --memory 7936m \
            --pids-limit 1024 \
            -e XLSLIBERATOR_LIBREOFFICE_MCP_ENDPOINT=http://127.0.0.1:8000/mcp \
            "${SANDBOX_IMAGE}" \
            xlsliberator-sandbox-smoke
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.SANDBOX_IMAGE }}
          format: spdx-json
          output-file: xlsliberator-sandbox.spdx.json
          upload-artifact: false
      - name: Collect Docker evidence
        if: ${{ !cancelled() }}
        run: |
          docker compose -f xlsliberator/docker-compose.yml logs \
            --no-color xlsliberator-mcp > libreoffice-mcp.log 2>&1 || true
          docker image inspect "${SANDBOX_IMAGE}" \
            > xlsliberator-swe/sandbox-image-inspect.json 2>&1 || true
      - name: Upload sandbox evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: xlsliberator-sandbox-evidence
          path: |
            libreoffice-mcp.log
            xlsliberator-sandbox.spdx.json
            xlsliberator-swe/sandbox-resolved.uv.lock
            xlsliberator-swe/sandbox-identity.json
            xlsliberator-swe/sandbox-image-inspect.json
          retention-days: 14
